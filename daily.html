<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08121e"><title>দৈনিক কোরআন ও হাদিস</title>
<style>body{margin:0;padding:24px;background:#08121e;color:#f4f7ff;font-family:system-ui,'Noto Sans Bengali',sans-serif;line-height:1.8}.wrap{max-width:720px;margin:auto}.card{background:#111b2d;border:1px solid #263752;border-radius:20px;padding:22px;margin:16px 0}.arabic{font-size:1.6rem;line-height:2.1;text-align:right;font-family:serif}.muted{color:#9aaac2;font-size:.9rem}a{color:#62e6c2}h1{font-size:1.35rem}</style></head>
<body><main class="wrap"><p><a href="./">← Smart Salary App</a></p><h1 id="heading">আজকের ইসলামিক পাঠ</h1><div class="card"><p id="loading">পাঠ লোড হচ্ছে…</p><p class="arabic" id="arabic"></p><p id="translation"></p><p class="muted" id="reference"></p><p class="muted" id="source"></p></div></main>
<script>
(async()=>{const q=new URLSearchParams(location.search),kind=q.get('kind')==='hadith'?'hadith':'quran';let date=q.get('date');if(!date){const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'});date=f.format(new Date())}document.getElementById('heading').textContent=kind==='quran'?'আজকের কোরআনের আয়াত':'আজকের সহিহ হাদিস';try{const base=String(window.API_BASE||'https://smart-salary-app.onrender.com').replace(/\/$/,'');const r=await fetch(base+'/api/daily/'+kind+'/'+date,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'পাঠ পাওয়া যায়নি');document.getElementById('loading').remove();document.getElementById('arabic').textContent=d.arabic;document.getElementById('translation').textContent=d.translation;document.getElementById('reference').textContent=d.reference;document.getElementById('source').textContent='সূত্র: '+d.source_name+' · '+d.source_url}catch(e){document.getElementById('loading').textContent=e.message}})();
</script><script src="./api-config.js"></script></body></html>
