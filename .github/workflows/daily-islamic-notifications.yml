name: Daily Quran and Hadith notifications
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Which notification to test manually
        required: true
        type: choice
        options:
          - quran
          - hadith
jobs:
  push-validation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow file updated; scheduled dispatch steps are intentionally not run on code pushes."
  dispatch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Quran notification at 09:00 Bangladesh time
        if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'quran')
        env:
          API_BASE_URL: https://smart-salary-app.onrender.com
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          test -n "$PUSH_CRON_SECRET" || { echo 'PUSH_CRON_SECRET missing'; exit 1; }
          curl --fail --silent --show-error --retry 2 --retry-delay 5 -X POST "$API_BASE_URL/api/push/dispatch/quran" -H "x-push-secret: $PUSH_CRON_SECRET"
      - name: Send Hadith notification at 21:00 Bangladesh time
        if: github.event.schedule == '0 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'hadith')
        env:
          API_BASE_URL: https://smart-salary-app.onrender.com
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          test -n "$PUSH_CRON_SECRET" || { echo 'PUSH_CRON_SECRET missing'; exit 1; }
          curl --fail --silent --show-error --retry 2 --retry-delay 5 -X POST "$API_BASE_URL/api/push/dispatch/hadith" -H "x-push-secret: $PUSH_CRON_SECRET"
