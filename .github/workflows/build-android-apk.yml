        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] ||
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] ||
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/smart-salary-release.keystore

          test -s app/smart-salary-release.keystore

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file('smart-salary-release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """

          if 'signingConfigs {' not in s:
              s = re.sub(
                  r'android\\s*\\{',
                  lambda m: m.group(0) + '\\n' + signing,
                  s,
                  count=1
              )

          if 'signingConfig signingConfigs.release' not in s:
              pattern = r'(buildTypes\\s*\\{\\s*release\\s*\\{)'
              s, count = re.subn(
                  pattern,
                  r'\\1\\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      'Could not configure release signing in buildTypes.'
                  )

          p.write_text(s)
          print('Release signing configuration completed.')
          PY

      - name: Build Release APK
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          set -e

          APK="android-wrapper/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --print-certs "$APK"

      - name: Prepare APK
        run: |
          cp android-wrapper/android/app/build/outputs/apk/release/app-release.apk \
             Smart-Salary.apk

          test -s Smart-Salary.apk

          ls -lh Smart-Salary.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-salary-release-${{ github.run_number }}
          name: Smart Salary App Release ${{ github.run_number }}
          make_latest: true
          files: Smart-Salary.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Salary-Release-APK
          path: Smart-Salary.apk
          if-no-files-found: error
          retention-days: 30
