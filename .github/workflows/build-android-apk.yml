
name: Smart Salary - Final Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - 'admin.html'
      - 'index.html'
      - 'server.js'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Backend
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://smart-salary-app.onrender.com/api/health
          node --check server.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install Dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Build Web App
        working-directory: android-wrapper
        run: node build-local-web.mjs

      - name: Create Android
        working-directory: android-wrapper
        run: npx cap add android

      - name: Configure Version
        working-directory: android-wrapper/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          code = int(os.environ["BUILD_NUMBER"]) + 10
          version = f"1.0.{code}"

          s, n = re.subn(
              r'versionCode\s+\d+',
              f'versionCode {code}',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("versionCode update failed")

          s, n = re.subn(
              r'versionName\s+"[^"]+"',
              f'versionName "{version}"',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("versionName update failed")

          p.write_text(s)
          print("Version:", version)
          PY

      - name: Generate App Assets
        working-directory: android-wrapper
        run: |
          set -e
          mkdir -p assets
          python -m pip install --quiet --retries 5 --timeout 60 pillow

          python - <<'PY'
          from PIL import Image, ImageOps

          src = Image.open(
              "../Ronykhan_Salaryapp_launcher_1.png"
          ).convert("RGBA")

          icon = ImageOps.contain(src, (1024, 1024))
          canvas = Image.new(
              "RGBA", (1024, 1024), (5, 5, 7, 255)
          )

          canvas.alpha_composite(
              icon,
              (
                  (1024-icon.width)//2,
                  (1024-icon.height)//2
              )
          )

          canvas.convert("RGB").save("assets/icon.png")

          Image.new(
              "RGB", (2732, 2732), (5, 5, 7)
          ).save("assets/splash.png")
          PY

          npx capacitor-assets generate --android

      - name: Sync Android
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Setup Release Keystore
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          mkdir -p app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/smart-salary-release.keystore

          test -s app/smart-salary-release.keystore

          keytool -list \
            -keystore app/smart-salary-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          def locate_block(text, name, start=0):
              pattern = re.compile(
                  r'\b' + re.escape(name) + r'\s*\{'
              )
              m = pattern.search(text, start)

              if not m:
                  raise RuntimeError(
                      "Cannot find Gradle block: " + name
                  )

              opening = text.find("{", m.start())
              depth = 0
              quote = None
              escape = False

              for i in range(opening, len(text)):
                  c = text[i]

                  if quote:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == quote:
                          quote = None
                      continue

                  if c in ("'", '"'):
                      quote = c
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, i

              raise RuntimeError(
                  "Unbalanced Gradle braces: " + name
              )

          # Find android block
          android_open, android_close = locate_block(
              s, "android"
          )

          # Remove existing signingConfigs block
          try:
              sc_open, sc_close = locate_block(
                  s, "signingConfigs", android_open
              )
              s = s[:sc_open] + s[sc_close + 1:]
          except RuntimeError:
              pass

          # Re-find android after modification
          android_open, android_close = locate_block(
              s, "android"
          )

          signing = """
          signingConfigs {
              release {
                  storeFile file('smart-salary-release.keystore')
                  storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('ANDROID_KEY_ALIAS')
                  keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
          }
          """

          s = (
              s[:android_open + 1]
              + "\n"
              + signing
              + "\n"
              + s[android_open + 1:]
          )

          # Locate buildTypes
          bt_open, bt_close = locate_block(
              s, "buildTypes"
          )

          # Find release build type inside buildTypes
          release_open, release_close = locate_block(
              s, "release", bt_open + 1
          )

          release_text = s[
              release_open + 1:release_close
          ]

          # Remove any old signingConfig entry
          release_text = re.sub(
              r'(?m)^\s*signingConfig\s+.*$',
              '',
              release_text
          )

          # Force our release signing config
          release_text = (
              "\n"
              "            signingConfig signingConfigs.release\n"
              + release_text
          )

          s = (
              s[:release_open + 1]
              + release_text
              + s[release_close:]
          )

          p.write_text(s)
          print("Release signing configured.")
          PY

      - name: Build Release APK
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify Release Signature
        run: |
          set -e

          APK="android-wrapper/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$apksigner" verify --verbose "$APK"
          "$apksigner" verify --print-certs "$APK"

          sha256sum "$APK"

      - name: Prepare APK
        run: |
          set -e

          cp \
            android-wrapper/android/app/build/outputs/apk/release/app-release.apk \
            Smart-Salary.apk

          test -s Smart-Salary.apk
          ls -lh Smart-Salary.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-salary-release-${{ github.run_number }}
          name: Smart Salary App Release ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: Smart-Salary.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Salary-Release-APK
          path: Smart-Salary.apk
          if-no-files-found: error
          retention-days: 30
