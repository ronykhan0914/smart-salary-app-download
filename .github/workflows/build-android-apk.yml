name: Smart Salary - Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - 'admin.html'
      - 'index.html'
      - 'server.js'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Backend
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://smart-salary-app.onrender.com/api/health
          echo
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            https://smart-salary-app.onrender.com/api/push/public-key
          echo
          node --check server.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Bundle app frontend
        working-directory: android-wrapper
        run: node build-local-web.mjs

      - name: Create Android platform
        working-directory: android-wrapper
        run: npx cap add android

      - name: Configure app version
        working-directory: android-wrapper/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          code = int(os.environ["BUILD_NUMBER"]) + 10
          name = f"1.0.{code}"

          s, count = re.subn(
              r'versionCode\s+\d+',
              f'versionCode {code}',
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("versionCode could not be updated")

          s, count = re.subn(
              r'versionName\s+"[^"]+"',
              f'versionName "{name}"',
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("versionName could not be updated")

          p.write_text(s)
          print(f"Release version: {name}, code {code}")
          PY

      - name: Generate app icon and splash
        working-directory: android-wrapper
        run: |
          set -e
          mkdir -p assets
          cp ../Ronykhan_Salaryapp_launcher_1.png /tmp/app-icon.png

          python -m pip install --quiet pillow

          python - <<'PY'
          from PIL import Image, ImageOps

          src = Image.open('/tmp/app-icon.png').convert('RGBA')
          icon = ImageOps.contain(src, (1024, 1024))

          canvas = Image.new(
              'RGBA',
              (1024, 1024),
              (5, 5, 7, 255)
          )

          canvas.alpha_composite(
              icon,
              ((1024-icon.width)//2, (1024-icon.height)//2)
          )

          canvas.convert('RGB').save('assets/icon.png')

          Image.new(
              'RGB',
              (2732, 2732),
              (5, 5, 7)
          ).save('assets/splash.png')
          PY

      - name: Generate Android assets
        working-directory: android-wrapper
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Configure Release Signing
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] ||
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] ||
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/smart-salary-release.keystore

          test -s app/smart-salary-release.keystore

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          def block(text, name):
              match = re.search(
                  r'\b' + re.escape(name) + r'\s*\{',
                  text
              )

              if not match:
                  raise SystemExit(f"Gradle block not found: {name}")

              opening = text.find("{", match.start())
              depth = 0

              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return opening, i

              raise SystemExit(f"Unbalanced Gradle block: {name}")

          android_match = re.search(r'\bandroid\s*\{', s)

          if not android_match:
              raise SystemExit("android block not found")

          android_open = s.find("{", android_match.start())

          if not re.search(r'\bsigningConfigs\s*\{', s):
              signing_configs = """
              signingConfigs {
                  release {
                      storeFile file('smart-salary-release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              """

              s = (
                  s[:android_open + 1]
                  + signing_configs
                  + s[android_open + 1:]
              )

          else:
              sc_open, sc_close = block(s, "signingConfigs")
              sc_content = s[sc_open + 1:sc_close]

              if not re.search(r'\brelease\s*\{', sc_content):
                  release_signing = """
                  release {
                      storeFile file('smart-salary-release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
                  """

                  s = (
                      s[:sc_close]
                      + release_signing
                      + s[sc_close:]
                  )

          bt_open, bt_close = block(s, "buildTypes")
          bt_content = s[bt_open + 1:bt_close]

          release_match = re.search(r'\brelease\s*\{', bt_content)

          if not release_match:
              raise SystemExit("release buildType not found")

          release_open = bt_open + 1 + release_match.start()
          release_brace = s.find("{", release_open)

          release_open, release_close = block(
              s[release_open:bt_close],
              "release"
          )

          release_open = bt_open + 1 + release_match.start()
          release_brace = s.find("{", release_open)

          release_content = s[release_brace + 1:bt_close]

          if "signingConfig signingConfigs.release" not in release_content:
              s = (
                  s[:release_brace + 1]
                  + "\n            signingConfig signingConfigs.release\n"
                  + s[release_brace + 1:]
              )

          p.write_text(s)
          print("Release signing configuration completed.")
          PY

      - name: Build Release APK
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          set -e

          APK="android-wrapper/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --print-certs "$APK"

      - name: Prepare APK
        run: |
          set -e

          cp android-wrapper/android/app/build/outputs/apk/release/app-release.apk \
             Smart-Salary.apk

          test -s Smart-Salary.apk
          ls -lh Smart-Salary.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-salary-release-${{ github.run_number }}
          name: Smart Salary App Release ${{ github.run_number }}
          make_latest: true
          files: Smart-Salary.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Salary-Release-APK
          path: Smart-Salary.apk
          if-no-files-found: error
          retention-days: 30
